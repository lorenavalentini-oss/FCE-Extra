g"], "answer": 0}]}, {"page": "READING", "title": "Reading 1 · The four-day working week", "source": "Original B2 reading", "questions": [{"q": "What is the writer’s main point?", "options": ["A four-day week requires thoughtful organisational changes.", "All companies should close on Fridays.", "Employees become less productive with shorter weeks.", "Salary reductions are necessary."], "answer": 0}, {"q": "What does “squeezing” suggest?", "options": ["Sharing tasks fairly.", "Fitting too much work into limited time.", "Cancelling unnecessary duties.", "Reducing the difficulty of tasks."], "answer": 1}, {"q": "Why might customer-facing businesses face difficulties?", "options": ["They must maintain service coverage.", "Their salaries are too high.", "Their employees dislike customers.", "They have fewer meetings."], "answer": 0}, {"q": "Which claim would the writer most likely support?", "options": ["Employees should work longer days.", "The same solution suits every sector.", "Workload design matters more than a simple schedule change.", "A shorter week always reduces stress."], "answer": 2}], "passage": "A growing number of organisations are experimenting with a four-day working week without reducing employees’ salaries. Supporters argue that shorter weeks encourage people to prioritise tasks, reduce unnecessary meetings and protect their well-being. Yet the results are not equally positive everywhere. In customer-facing roles, companies may need to hire extra staff to maintain opening hours. Some employees also report that squeezing five days of work into four leaves them exhausted. Researchers therefore suggest that success depends less on the number of days than on how responsibilities are redesigned. A shorter week may be beneficial, but only when workloads, staffing and expectations change together."}, {"page": "READING", "title": "Reading 2 · Rethinking urban space", "source": "Original B2 reading", "questions": [{"q": "Why did some shop owners oppose the pl
